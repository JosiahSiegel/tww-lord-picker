# TWW Lord Picker — deploy manifest
# Used by /workspace/scripts/deploy.sh to verify safe deploys.

prod_url: https://twwlordpicker.com/
gh_repo: JosiahSiegel/tww-lord-picker
source_branch: gh-pages
pages_branch: gh-pages
verify_min_bytes: 100000
verify_timeout_sec: 180

required_files:
  - index.html
  - CNAME
  - og.png
  - manifest.webmanifest
  - sw.js
  - icon-192.png
  - icon-512.png

# Grep patterns (grep -E regex) that MUST appear in prod HTML after deploy.
verify_checks:
  - "TWW3 Lord Picker"
  - "buildAllLordsRadarSVG"
  - "const LORDS"
  - "Skarbrand"
  - "Update 9.0"
  - "og:image"
  - "Help me choose"
  - "manifest.webmanifest"

# Headless render assertions via jsdom (no layout engine: assert on DOM
# structure and attributes, never on getBoundingClientRect).
render_asserts:
  - "document.querySelectorAll('.card').length === 110"
  - "document.querySelector('#count')?.textContent?.includes('110')"
  - "document.querySelectorAll('.card-radar').length >= 110"
  - "document.querySelector('#fr-radar-svg')?.innerHTML?.length > 1000"
  # Interactive radar: one segment radar with four quadrant labels
  - "document.querySelectorAll('#fr-radar-svg svg.segment-radar').length === 1"
  - "document.querySelectorAll('#fr-radar-svg .seg-axis').length === 4"
  # Filter dimensions render: 9 start regions + 27 ownership products
  - "document.querySelectorAll('#locchips-bar .chip').length === 9"
  - "document.querySelectorAll('#own-body input[data-own]').length === 27"
  # Mobile UX: active-filter pill bar + back-to-top button
  - "document.querySelectorAll('#active-filters').length === 1"
  - "document.querySelectorAll('#back-to-top').length === 1"
  # Layout guard: every inline SVG must declare its own width and height.
  # Catches the class of bug where a raw SVG (e.g. an icon) has no
  # dimensions and expands to fill its container. Attribute-based, so it
  # works under jsdom and does not need a layout engine.
  - "document.querySelectorAll('svg:not([width])').length === 0"
  - "document.querySelectorAll('svg:not([height])').length === 0"
  # ── Data integrity, read from the rendered grid ────────────────────────
  # DOM-only (no module globals), so these hold however the deploy script
  # evaluates the expression, and they catch the "undefined" class of bug.
  - "document.querySelectorAll('.card .card-name').length === 110"
  - "[...document.querySelectorAll('.card .card-name')].every(n=>n.textContent.trim().length>0)"
  - "document.querySelectorAll('.card .ps-pill').length > 110"
  - "[...document.querySelectorAll('.card')].every(c=>c.querySelector('.card-name')&&c.querySelector('.sub')&&c.querySelector('.loc')&&c.querySelector('.ps-pill'))"
  - "[...document.querySelectorAll('.card .sub')].every(s=>!/undefined/.test(s.textContent))"
  - "[...document.querySelectorAll('.card .loc')].every(l=>l.textContent.trim().length>0)"
  # ── Quiz: the reported arbitrary-tie bug must stay fixed (drives the UI) ─
  # Veteran / build & defend / no preference / give me the buttons must not
  # return Drycha, and every pick must reflect the campaign-feel answer.
  - "(()=>{const pick=(n,v)=>{[...document.querySelectorAll('input[name=q-'+n+']')].find(x=>x.value===v).checked=true};pick('exp','vet');pick('pace','build');pick('battle','none');pick('micro','high');document.getElementById('quiz-loc').value='';document.getElementById('quiz-owned').checked=false;document.getElementById('quiz-go').click();const c=[...document.querySelectorAll('#quiz-results .quiz-card')];return c.length===3&&!c.some(x=>x.querySelector('.qc-name').textContent.includes('Drycha'))&&c.every(x=>x.querySelector('.qc-why').textContent.includes('campaign feel:'))})()"
  # ── Filter engine: a race chip narrows the grid; clear-all restores it ──
  - "(()=>{const n=()=>document.querySelectorAll('.card').length;const before=n();document.querySelector('#racechips-bar .chip[data-race=Khorne]').click();const after=n();const onlyKhorne=[...document.querySelectorAll('.card .sub')].every(s=>s.textContent.includes('Khorne'));document.querySelector('#clear-all').click();return before===110&&after<before&&onlyKhorne&&n()===110})()"
  # ── Ownership: an expansion unlocks only its own lords, not its base game ─
  - "(()=>{const cb=k=>document.querySelector('input[data-own='+k+']');cb('wh3_coc').checked=true;cb('wh3_coc').dispatchEvent(new Event('change',{bubbles:true}));const baseUnticked=cb('wh3').checked===false;const n=document.querySelectorAll('.card').length;document.querySelector('[data-own-all=clear]').click();return baseUnticked&&n===4})()"
